<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>智能体编排画布</title>
<style>
  :root{
    --bg:#050506; --panel:#0e0e11; --line:#232329; --line-2:#2f2f37;
    --ink:#f2f3f6; --ink-2:#9a9aa5; --ink-3:#6b6b76;
    --ok:#3ecf8e; --run:#e5b04a; --err:#ef5b5b; --idle:#56565f;
    --accent:#ff6d5a; --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}

  .bar{height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;
    background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:5}
  .bar .t{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42%}
  .bar .s{font-size:11px;color:var(--ink-3);font-family:var(--mono);white-space:nowrap}
  .chips{display:flex;gap:6px;margin-left:4px}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--ink-2);
    background:#141418;border:1px solid var(--line);border-radius:999px;padding:2px 7px;white-space:nowrap}
  .chip b{font-weight:600;color:var(--ink)}
  .chip .dot{width:6px;height:6px;border-radius:99px;background:var(--idle)}
  .chip[data-k="done"] .dot{background:var(--ok)}
  .chip[data-k="running"] .dot{background:var(--run)}
  .chip[data-k="error"] .dot{background:var(--err)}
  .spacer{flex:1}
  .btn{height:26px;display:inline-flex;align-items:center;gap:5px;padding:0 9px;border-radius:7px;
    border:1px solid var(--line-2);background:#141418;color:var(--ink-2);font:inherit;font-size:11.5px;cursor:pointer;white-space:nowrap}
  .btn:hover{background:#1a1a1f;color:var(--ink);border-color:#3d3d47}
  .btn.on{border-color:#4b6d8f;color:#cfe8ff;background:#16222e}
  .src{font-size:10.5px;color:var(--ink-3);font-family:var(--mono);white-space:nowrap}

  .stage{position:absolute;inset:44px 0 0;overflow:hidden;cursor:grab}
  .stage.drag{cursor:grabbing}
  .world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  svg.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  path.wire{fill:none;stroke:#2b3a4a;stroke-width:1.6;transition:stroke .18s,opacity .18s}
  path.wire.hot{stroke:var(--accent);stroke-width:2.2}
  path.wire.dim{opacity:.18}
  path.wire.flow{stroke:var(--accent);stroke-width:2.4;stroke-dasharray:6 8;animation:run .8s linear infinite}
  @keyframes run{to{stroke-dashoffset:-28}}

  .node{position:absolute;width:190px;height:66px;padding:8px 10px;border-radius:9px;
    background:linear-gradient(180deg,#15151a,#101014);border:1px solid var(--line-2);
    cursor:pointer;transition:border-color .16s,box-shadow .16s,opacity .16s;overflow:hidden}
  .node:hover{border-color:#4a5c76;background:linear-gradient(180deg,#1b1b22,#14141a);box-shadow:0 8px 22px -14px #000}
  .node:active{transform:translateY(.5px)}
  .node.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .node.dim{opacity:.28}
  .node .h{display:flex;align-items:center;gap:6px}
  .node .dot{width:7px;height:7px;border-radius:99px;background:var(--idle);flex:0 0 auto}
  .node[data-status="done"] .dot{background:var(--ok)}
  .node[data-status="running"] .dot{background:var(--run);animation:beat 1.4s ease-in-out infinite}
  .node[data-status="error"] .dot{background:var(--err)}
  @keyframes beat{50%{transform:scale(1.4)}}
  .node .st{margin-left:auto;font-size:10px;color:var(--ink-3)}
  .node .n{margin-top:3px;font-size:12.5px;font-weight:600;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .node .m{margin-top:2px;font-size:10px;color:var(--ink-3);font-family:var(--mono);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .empty{position:absolute;inset:44px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink-3)}
  .empty b{font-size:13px;color:var(--ink-2)}
  .empty span{font-size:11.5px}
  .pop{position:absolute;z-index:20;width:232px;padding:10px 11px;border-radius:10px;
    background:#141419;border:1px solid #2f2f37;box-shadow:0 18px 40px -22px #000,0 0 0 1px #00000080}
  .pop[hidden]{display:none}
  .pop h4{margin:0 0 2px;font-size:12.5px;font-weight:600;line-height:1.35;word-break:break-word}
  .pop .k{font-size:10px;color:var(--ink-3);font-family:var(--mono);word-break:break-all;margin-bottom:6px}
  .pop .row{display:flex;gap:6px;margin-top:8px}
  .pop button{flex:1;height:26px;border-radius:7px;border:1px solid #35353f;background:#191920;
    color:var(--ink-2);font:inherit;font-size:11px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
  .pop button:hover{background:#212129;color:var(--ink);border-color:#474753}
  .pop button:active{transform:translateY(.5px)}  .hintbar{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--ink-3);
    background:#0f0f13cc;border:1px solid var(--line);border-radius:999px;padding:4px 10px;backdrop-filter:blur(6px)}
  .flowbar{position:absolute;right:12px;bottom:10px;display:none;align-items:center;gap:8px;
    font-size:11px;color:var(--ink-2);background:#0f0f13cc;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
  .flowbar.on{display:inline-flex}
  .flowbar i{width:90px;height:3px;border-radius:99px;background:#22222a;overflow:hidden;display:block}
  .flowbar i b{display:block;height:100%;width:0;background:var(--accent)}
</style>
</head>
<body>
<div class="bar">
  <span class="t" id="title">智能体编排画布</span>
  <span class="s" id="session"></span>
  <span class="chips" id="chips"></span>
  <span class="spacer"></span>
  <span class="src" id="src"></span>
  <button class="btn" id="replay">数据流回放</button>
  <button class="btn" id="fit">适配</button>
</div>

<div class="stage" id="stage">
  <div class="world" id="world">
    <svg class="wires" id="wires"></svg>
    <div id="nodes"></div>
  </div>
  <div class="empty" id="empty">
    <b>等待会话数据…</b>
    <span>从会话头的「编排」打开，会自动带上当前会话的 agent 树</span>
  </div>
  <div class="pop" id="pop" hidden></div>
  <div class="hintbar">拖拽平移 · 滚轮缩放 · 双击空白适配 · 点节点看血缘</div>
  <div class="flowbar" id="flowbar"><span>回放</span><i><b id="flowbarFill"></b></i><span id="flowbarTxt"></span></div>
</div>

<script>
(function () {
  "use strict";

  var STATUS_WORD = { done: "已完成", running: "进行中", idle: "待命", error: "阻塞", queued: "排队", blocked: "阻塞" };
  var NODE_W = 190, NODE_H = 66, COL_GAP = 22, ROW_GAP = 46;
  var state = { graph: null, source: "waiting", view: { x: 0, y: 0, k: 1 }, sel: null, world: { w: 0, h: 0 }, pos: {} };

  var $ = function (id) { return document.getElementById(id); };
  var stage = $("stage"), world = $("world"), svg = $("wires"), nodesEl = $("nodes");

  function log(step, extra) {
    try {
      fetch("/workflow-canvas/api/log", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(Object.assign({ step: step }, extra || {})),
        keepalive: true
      }).catch(function () {});
    } catch (e) {}
  }

  function levelsOf(graph) {
    var parents = {};
    graph.nodes.forEach(function (n) { parents[n.id] = []; });
    graph.edges.forEach(function (e) { if (parents[e.to]) parents[e.to].push(e.from); });
    var memo = {};
    function depth(id, guard) {
      if (memo[id] !== undefined) return memo[id];
      if (guard > 40 || !parents[id] || parents[id].length === 0) return (memo[id] = 0);
      var max = 0;
      parents[id].forEach(function (p) { max = Math.max(max, depth(p, (guard || 0) + 1) + 1); });
      return (memo[id] = max);
    }
    var levels = [];
    graph.nodes.forEach(function (n) {
      var d = depth(n.id, 0);
      (levels[d] || (levels[d] = [])).push(n);
    });
    return levels;
  }

  function layout(graph) {
    var levels = levelsOf(graph);
    var pos = {}, maxW = 0;
    levels.forEach(function (row, depth) {
      if (!row) return;
      var w = row.length * NODE_W + (row.length - 1) * COL_GAP;
      maxW = Math.max(maxW, w);
    });
    levels.forEach(function (row, depth) {
      if (!row) return;
      var w = row.length * NODE_W + (row.length - 1) * COL_GAP;
      var shift = 24 + (maxW - w) / 2;
      row.forEach(function (n, i) {
        pos[n.id] = { x: shift + i * (NODE_W + COL_GAP), y: 24 + depth * (NODE_H + ROW_GAP), w: NODE_W, h: NODE_H };
      });
    });
    var maxH = 0;
    Object.keys(pos).forEach(function (id) { maxH = Math.max(maxH, pos[id].y + pos[id].h); });
    state.world = { w: maxW + 48, h: maxH + 48 };
    return pos;
  }

  function edgePath(a, b) {
    var x1 = a.x + a.w / 2, y1 = a.y + a.h;
    var x2 = b.x + b.w / 2, y2 = b.y;
    var midY = y1 + Math.max(16, (y2 - y1) / 2);
    var r = 10;
    if (Math.abs(x2 - x1) < 1) return "M" + x1 + "," + y1 + " V" + y2;
    var dir = x2 > x1 ? 1 : -1;
    return "M" + x1 + "," + y1 +
      " V" + (midY - r) +
      " Q" + x1 + "," + midY + " " + (x1 + dir * r) + "," + midY +
      " H" + (x2 - dir * r) +
      " Q" + x2 + "," + midY + " " + x2 + "," + (midY + r) +
      " V" + y2;
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function render() {
    var graph = state.graph;
    if (!graph) return;
    var pos = layout(graph);
    state.pos = pos;
    world.style.width = state.world.w + "px";
    world.style.height = state.world.h + "px";
    svg.setAttribute("width", state.world.w);
    svg.setAttribute("height", state.world.h);
    svg.setAttribute("viewBox", "0 0 " + state.world.w + " " + state.world.h);

    nodesEl.innerHTML = "";
    graph.nodes.forEach(function (n) {
      var p = pos[n.id];
      if (!p) return;
      var el = document.createElement("div");
      el.className = "node";
      el.dataset.id = n.id;
      el.dataset.status = n.status || "idle";
      el.style.left = p.x + "px";
      el.style.top = p.y + "px";
      el.innerHTML = '<div class="h"><i class="dot"></i><span class="st">' +
        escapeHtml(STATUS_WORD[n.status] || n.status || "") + '</span></div>' +
        '<div class="n">' + escapeHtml(n.name || n.id) + '</div>' +
        '<div class="m">' + escapeHtml(n.msg || "") + '</div>';
      el.addEventListener("click", function (ev) { ev.stopPropagation(); select(n.id); });
      el.addEventListener("dblclick", function (ev) {
        ev.stopPropagation();
        try { if (window.parent !== window) window.parent.postMessage({ type: "wc-open", id: n.id }, "*"); } catch (e) {}
      });
      nodesEl.appendChild(el);
    });

    svg.innerHTML = "";
    graph.edges.forEach(function (e) {
      var a = pos[e.from], b = pos[e.to];
      if (!a || !b) return;
      var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("class", "wire");
      path.setAttribute("d", edgePath(a, b));
      path.dataset.edge = e.id;
      svg.appendChild(path);
    });

    var counts = { done: 0, running: 0, error: 0 };
    graph.nodes.forEach(function (n) { if (counts[n.status] !== undefined) counts[n.status] += 1; });
    $("chips").innerHTML =
      '<span class="chip" data-k="done"><i class="dot"></i>已完成 <b>' + counts.done + '</b></span>' +
      '<span class="chip" data-k="running"><i class="dot"></i>进行中 <b>' + counts.running + '</b></span>' +
      (counts.error ? '<span class="chip" data-k="error"><i class="dot"></i>阻塞 <b>' + counts.error + '</b></span>' : '');
    $("title").textContent = (graph.meta && graph.meta.title) || "智能体编排画布";
    $("session").textContent = [graph.meta && graph.meta.session, graph.meta && graph.meta.updated].filter(Boolean).join(" · ");
    $("src").textContent = state.source === "live" ? "实时" : state.source === "sample" ? "样例" : "等待数据";
    $("empty").style.display = "none";
    log("page-rendered", { source: state.source, nodes: graph.nodes.length, edges: graph.edges.length });
    applyView();
  }

  function applyView() {
    world.style.transform = "translate(" + state.view.x + "px," + state.view.y + "px) scale(" + state.view.k + ")";
  }

  function fit() {
    if (!state.graph) return;
    var w = stage.clientWidth, h = stage.clientHeight;
    var k = Math.max(0.25, Math.min((w - 32) / state.world.w, (h - 32) / state.world.h, 1.1));
    state.view.k = k;
    state.view.x = (w - state.world.w * k) / 2;
    state.view.y = (h - state.world.h * k) / 2;
    applyView();
  }

  function setGraph(graph, source) {
    if (!graph || !graph.nodes || !graph.nodes.length) return;
    state.graph = graph;
    state.source = source;
    render();
    requestAnimationFrame(fit);
  }

  var pop = $("pop");
  function hidePop() { pop.hidden = true; }
  function showPop(n, nodeEl) {
    if (!n) return hidePop();
    var r = nodeEl.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    var word = STATUS_WORD[n.status] || n.status || "";
    pop.innerHTML = '<h4>' + escapeHtml(n.name || n.id) + '</h4>' +
      '<div class="k">' + escapeHtml(word) + (n.msg ? ' · ' + escapeHtml(n.msg) : '') +
      ' · ' + escapeHtml(String(n.id).slice(0, 12)) + '</div>' +
      '<div class="row"><button data-act="open">打开对话</button><button data-act="copy">复制标题</button></div>';
    pop.style.left = Math.min(Math.max(8, r.left - sr.left + r.width + 10), sr.width - 244) + 'px';
    pop.style.top = Math.min(Math.max(8, r.top - sr.top - 4), sr.height - 110) + 'px';
    pop.hidden = false;
    pop.querySelector('[data-act="open"]').onclick = function () {
      try { if (window.parent !== window) window.parent.postMessage({ type: "wc-open", id: n.id }, "*"); } catch (e) {}
    };
    pop.querySelector('[data-act="copy"]').onclick = function () {
      try { navigator.clipboard.writeText(n.name || n.id); } catch (e) {}
    };
  }  function select(id) {
    state.sel = id;
    var keep = {};
    keep[id] = true;
    (state.graph.edges || []).forEach(function (e) {
      if (e.from === id || e.to === id) { keep[e.from] = true; keep[e.to] = true; }
    });
    Array.prototype.forEach.call(nodesEl.children, function (el) {
      el.classList.toggle("sel", el.dataset.id === id);
      el.classList.toggle("dim", !keep[el.dataset.id]);
    });
    Array.prototype.forEach.call(svg.children, function (p) {
      var e = (state.graph.edges || []).filter(function (x) { return x.id === p.dataset.edge; })[0];
      var hot = !!e && (e.from === id || e.to === id);
      p.classList.toggle("hot", hot);
      p.classList.toggle("dim", !hot);
    });
    var nodeEl = null;
    Array.prototype.forEach.call(nodesEl.children, function (el) { if (el.dataset.id === id) nodeEl = el; });
    var node = (state.graph.nodes || []).filter(function (x) { return x.id === id; })[0];
    showPop(node, nodeEl || { getBoundingClientRect: function () { return { left: 0, top: 0, width: 0, height: 0 }; } });
    try { if (window.parent !== window) window.parent.postMessage({ type: "wc-node", id: id }, "*"); } catch (e) {}
  }

  function clearSelect() {
    state.sel = null;
    hidePop();
    Array.prototype.forEach.call(nodesEl.children, function (el) { el.classList.remove("sel", "dim"); });
    Array.prototype.forEach.call(svg.children, function (p) { p.classList.remove("hot", "dim", "flow"); });
  }

  var drag = null;
  stage.addEventListener("pointerdown", function (ev) {
    if (ev.button !== 0 || ev.target.closest(".node")) return;
    drag = { x: ev.clientX, y: ev.clientY, ox: state.view.x, oy: state.view.y };
    stage.classList.add("drag");
    stage.setPointerCapture(ev.pointerId);
  });
  stage.addEventListener("pointermove", function (ev) {
    if (!drag) return;
    state.view.x = drag.ox + (ev.clientX - drag.x);
    state.view.y = drag.oy + (ev.clientY - drag.y);
    applyView();
  });
  stage.addEventListener("pointerup", function () { drag = null; stage.classList.remove("drag"); });
  stage.addEventListener("pointercancel", function () { drag = null; stage.classList.remove("drag"); });
  stage.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    var r = stage.getBoundingClientRect();
    var mx = ev.clientX - r.left, my = ev.clientY - r.top;
    var next = Math.min(2.2, Math.max(0.2, state.view.k * Math.exp(-ev.deltaY * 0.0013)));
    var ratio = next / state.view.k;
    state.view.x = mx - (mx - state.view.x) * ratio;
    state.view.y = my - (my - state.view.y) * ratio;
    state.view.k = next;
    applyView();
  }, { passive: false });
  stage.addEventListener("dblclick", function (ev) { if (!ev.target.closest(".node")) { fit(); hidePop(); } });
  stage.addEventListener("click", function (ev) { if (!ev.target.closest(".node")) clearSelect(); });
  $("fit").addEventListener("click", fit);

  var replaying = false;
  $("replay").addEventListener("click", function () {
    if (!state.graph || replaying) return;
    replaying = true;
    $("replay").classList.add("on");
    $("flowbar").classList.add("on");
    var edges = (state.graph.edges || []).slice();
    var i = 0;
    var tick = function () {
      if (i >= edges.length) {
        $("flowbarTxt").textContent = "完成";
        setTimeout(function () {
          replaying = false;
          $("replay").classList.remove("on");
          $("flowbar").classList.remove("on");
          Array.prototype.forEach.call(svg.children, function (p) { p.classList.remove("flow"); });
          $("flowbarFill").style.width = "0%";
        }, 700);
        return;
      }
      var e = edges[i];
      Array.prototype.forEach.call(svg.children, function (p) { if (p.dataset.edge === e.id) p.classList.add("flow"); });
      $("flowbarTxt").textContent = (e.label || "") + " " + (e.payload || "");
      $("flowbarFill").style.width = Math.round(((i + 1) / edges.length) * 100) + "%";
      i += 1;
      setTimeout(tick, 620);
    };
    tick();
  });

  window.addEventListener("resize", function () { if (state.graph) fit(); });

  try {
    var inline = location.hash.length > 1 ? JSON.parse(decodeURIComponent(location.hash.slice(1))) : null;
    if (inline && inline.nodes && inline.nodes.length) {
      log("page-boot", { via: "hash", nodes: inline.nodes.length });
      setGraph(inline, "live");
    }
  } catch (e) {
    log("page-hash-err", { error: String(e && e.message) });
  }

  window.addEventListener("message", function (ev) {
    var d = ev.data;
    if (!d || d.type !== "wc-graph" || !d.graph) return;
    setGraph(d.graph, "live");
  });

  if (!state.graph) {
    log("page-boot", { via: "wait" });
    try { if (window.parent !== window) window.parent.postMessage({ type: "wc-ready" }, "*"); } catch (e) {}
  }
})();
</script>
</body>
</html>
